[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sofar-modbus"
version = "0.0.0"
description = "Read Sofar Solar inverters (HYD, KTL-X and the older PV/storage range) over Modbus."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "sofar-modbus contributors" }]
keywords = ["modbus", "sofar", "sofar-solar", "inverter", "solar", "home-assistant"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
# Callers inject the unit; tmodbus is the backend tests run against.
dependencies = ["modbus-connection[tmodbus]>=4.12.1"]

[project.urls]
Homepage = "https://github.com/darkrain-nl/sofar-modbus"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "syrupy>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sofar_modbus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Docstrings name things, like modbus-connection's; class covers D107.
ignore = ["D107", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "script"]
strict = true

[tool.ruff.lint.per-file-ignores]
# A test's name documents it; a docstring is only for a needed why.
"tests/*" = ["D100", "D103", "D104"]
# TimedUnit's pass-throughs would only repeat ModbusUnit's docstrings.
"src/sofar_modbus/tuning.py" = ["D102"]
